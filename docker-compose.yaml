services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
       POSTGRES_USER: ${POSTGRES_USER}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer:latest
    container_name: adminer
    networks:
      - backend
    ports:
      - "3000:8080"

networks:
  backend:
    name: backend

volumes:
  pgdata:
    name: pgdata


